name: clean-checkout CPU contracts
on: [push, pull_request]
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install torch==2.9.1 torchvision==0.24.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-audit.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_release.py
      - run: git diff --check
